<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b18" />
  <title>Hello World — A Little Spark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; --ink:#f6f5ff; --muted:#a8a8c2; --violet:#a78bfa; --cyan:#67e8f9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; display:grid; place-items:center; color:var(--ink); font-family:'DM Sans',sans-serif; background:radial-gradient(ellipse at 50% 42%,#202047 0%,#101225 42%,#090b18 78%); }
    .stars,.stars::before,.stars::after { position:absolute; inset:0; content:""; pointer-events:none; background-image:radial-gradient(1px 1px at 12% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 79% 16%,#bdb7ff 99%,transparent),radial-gradient(1.5px 1.5px at 87% 72%,#fff 99%,transparent),radial-gradient(1px 1px at 24% 78%,#a5f3fc 99%,transparent),radial-gradient(1px 1px at 68% 88%,#fff 99%,transparent),radial-gradient(1px 1px at 43% 13%,#fff 99%,transparent),radial-gradient(1px 1px at 7% 61%,#fff 99%,transparent); background-size:100% 100%; opacity:.58; animation:twinkle 5s ease-in-out infinite alternate; }
    .stars::before { transform:translate(13px,18px); opacity:.42; animation-delay:-2s; }
    .stars::after { transform:translate(-18px,-12px); opacity:.32; animation-delay:-3.5s; }
    .orb { position:absolute; width:min(62vw,650px); aspect-ratio:1; border-radius:50%; background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(34,211,238,.08)); filter:blur(75px); opacity:.65; animation:float 9s ease-in-out infinite alternate; }
    main { position:relative; width:min(760px,90vw); padding:clamp(38px,8vw,82px) 28px; text-align:center; animation:rise 1s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; padding:9px 14px; border:1px solid rgba(255,255,255,.12); border-radius:999px; background:rgba(255,255,255,.045); color:#d5d4eb; font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; backdrop-filter:blur(10px); }
    .spark { width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan); }
    h1 { margin:28px 0 15px; font:800 clamp(3.5rem,11vw,7.6rem)/.98 'Manrope',sans-serif; letter-spacing:-.085em; }
    h1 span { display:block; color:transparent; background:linear-gradient(100deg,#fff 12%,#cbc2ff 48%,#7ce8f2 92%); background-clip:text; -webkit-background-clip:text; filter:drop-shadow(0 0 35px rgba(167,139,250,.18)); }
    p { max-width:470px; margin:0 auto; color:var(--muted); font-size:clamp(1rem,2vw,1.13rem); line-height:1.75; }
    .rule { display:flex; align-items:center; justify-content:center; gap:12px; margin:34px auto 0; color:#777894; font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    .rule::before,.rule::after { content:""; width:34px; height:1px; background:linear-gradient(90deg,transparent,rgba(190,180,255,.55)); }
    .rule::after { transform:scaleX(-1); }
    .footer { position:absolute; bottom:25px; left:0; right:0; text-align:center; color:#676981; font-size:11px; letter-spacing:.12em; }
    @keyframes rise { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes float { from { transform:translate(-5%,2%) scale(.94); } to { transform:translate(5%,-3%) scale(1.06); } }
    @keyframes twinkle { from { opacity:.32; } to { opacity:.7; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="orb" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="spark"></span>A new beginning</div>
    <h1>Hello<span>World.</span></h1>
    <p>A small greeting from this little corner of the universe.<br />Here’s to everything that starts with a hello.</p>
    <div class="rule">Make something wonderful</div>
  </main>
  <div class="footer">MADE WITH A LITTLE SPARK ✦</div>
</body>
</html>
