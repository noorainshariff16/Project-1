<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b18" />
  <title>Contact — A Little Spark</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme:dark; --ink:#f6f5ff; --muted:#a8a8c2; --cyan:#67e8f9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:'DM Sans',sans-serif; background:radial-gradient(ellipse at 50% 42%,#202047 0%,#101225 45%,#090b18 82%); }
    .stars { position:fixed; inset:0; pointer-events:none; opacity:.52; background-image:radial-gradient(1px 1px at 12% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 79% 16%,#bdb7ff 99%,transparent),radial-gradient(1.5px 1.5px at 87% 72%,#fff 99%,transparent),radial-gradient(1px 1px at 24% 78%,#a5f3fc 99%,transparent),radial-gradient(1px 1px at 68% 88%,#fff 99%,transparent),radial-gradient(1px 1px at 43% 13%,#fff 99%,transparent); }
    nav { position:fixed; z-index:2; top:26px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px; border:1px solid rgba(255,255,255,.11); border-radius:999px; background:rgba(13,15,34,.68); backdrop-filter:blur(14px); white-space:nowrap; }
    nav a { padding:10px 16px; border-radius:999px; color:#aaaac4; text-decoration:none; font-size:13px; font-weight:600; transition:background .2s,color .2s; }
    nav a:hover, nav a[aria-current="page"] { color:#fff; background:rgba(255,255,255,.1); }
    main { position:relative; width:min(600px,90vw); padding:118px 28px 95px; text-align:center; animation:rise .8s ease both; }
    .eyebrow { display:inline-flex; align-items:center; gap:9px; padding:9px 14px; border:1px solid rgba(255,255,255,.12); border-radius:999px; background:rgba(255,255,255,.045); color:#d5d4eb; font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
    .spark { width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan); }
    h1 { margin:26px 0 16px; font:800 clamp(3.4rem,9vw,6.4rem)/1 'Manrope',sans-serif; letter-spacing:-.08em; }
    h1 span { color:transparent; background:linear-gradient(100deg,#fff,#cbc2ff 55%,#7ce8f2); background-clip:text; -webkit-background-clip:text; }
    .intro { max-width:450px; margin:0 auto; color:#c6c4dc; font-size:1.08rem; line-height:1.75; }
    .contact-card { margin:34px auto 0; padding:28px; max-width:470px; border:1px solid rgba(255,255,255,.12); border-radius:22px; background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)); box-shadow:0 24px 70px rgba(0,0,0,.2); }
    .label { margin:0 0 12px; color:#8889a9; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .email { display:inline-block; color:#e8e5ff; font:600 clamp(1.1rem,4vw,1.5rem) 'Manrope',sans-serif; text-decoration:none; border-bottom:1px solid rgba(103,232,249,.45); padding-bottom:4px; transition:color .2s,border-color .2s; }
    .email:hover { color:var(--cyan); border-color:var(--cyan); }
    .note { margin:18px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
    .footer { position:fixed; bottom:22px; left:0; right:0; text-align:center; color:#676981; font-size:11px; letter-spacing:.12em; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:520px) { nav { top:16px; } nav a { padding:9px 12px; font-size:12px; } .contact-card { padding:23px 16px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav aria-label="Main navigation">
    <a href="hello-world.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <div class="eyebrow"><span class="spark"></span>We'd love to hear from you</div>
    <h1>Say <span>hello.</span></h1>
    <p class="intro">Have a thought, a question, or just want to say hi? Our inbox is always open.</p>
    <section class="contact-card" aria-label="Contact details">
      <p class="label">Drop us a note</p>
      <a class="email" href="mailto:hello@example.com">hello@example.com</a>
      <p class="note">Tap the address to open your email app. We’ll be glad to hear from you.</p>
    </section>
  </main>
  <div class="footer">MADE WITH A LITTLE SPARK ✦</div>
</body>
</html>
